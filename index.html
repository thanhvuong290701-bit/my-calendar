<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lịch Cho EmBe 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- THANH TRÊN -->

    <header class="topbar">

        <div class="brand">

            <button id="menuBtn" class="icon-btn">
                ☰
            </button>

            <h1>💗 Lịch Cho EmBe</h1>

        </div>


        <div class="navigation">

            <button id="prevWeek" class="nav-btn">
                ‹
            </button>

            <button id="todayBtn" class="today-btn">
                Hôm nay
            </button>

            <button id="nextWeek" class="nav-btn">
                ›
            </button>

            <div id="weekTitle" class="week-title">
                Tuần
            </div>

        </div>

    </header>


    <!-- LỊCH -->

    <main class="calendar-container">

        <div class="calendar-scroll">

            <div class="calendar">

                <!-- CỘT GIỜ -->

                <div class="time-column">

                    <div class="time-header"></div>

                    <div id="timeLabels"></div>

                </div>


                <!-- 7 NGÀY -->

                <div id="weekColumns"
                    class="week-columns">

                </div>

            </div>

        </div>

    </main>


    <!-- MODAL -->

    <div id="modal" class="modal">

        <div class="modal-content">

            <button id="closeModal"
                class="close">
                ×
            </button>


            <h2 id="selectedDate">
                Thêm ghi chú
            </h2>


            <label>
                Giờ
            </label>

            <input
                type="time"
                id="noteTime"
            >


            <label>
                Tiêu đề
            </label>

            <input
                type="text"
                id="noteTitle"
                placeholder="Nhập nội dung..."
            >


            <label>
                Nội dung
            </label>

            <textarea
                id="noteContent"
                placeholder="Nhập nội dung..."
            ></textarea>


            <label>
                Người cập nhật
            </label>

            <input
                type="text"
                id="createdBy"
                placeholder="Nhập tên"
            >


            <div id="existingNotes"
                class="existing-notes">

            </div>


            <div class="modal-buttons">

                <button
                    id="deleteBtn"
                    class="delete-btn">
                    Xóa
                </button>


                <div>

                    <button
                        id="cancelBtn">
                        Hủy
                    </button>

                    <button
                        id="saveBtn"
                        class="save-btn">
                        Lưu
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</div>

</body>
</html>
